career-profile:
  title: Kurzprofil
  summary: |
    Langjährige Hochschulerfahrung in Elektro- und Energietechnik mit abgeschlossener
    Promotion im Fach Elektrotechnik. Fachliche Schwerpunkte sind mathematische
    Modellierung, numerische Analyse und Simulation technischer Systeme sowie
    Transformatoren und elektrische Energiesysteme. Erfahrung in strukturierter
    Problemanalyse, technischer Dokumentation, Präsentation und Koordination.
    Ziel ist der Einstieg in die deutsche Industrie in einer technisch-analytischen
    Position mit Entwicklungsperspektive; dabei besteht Offenheit für neue Fachgebiete.

