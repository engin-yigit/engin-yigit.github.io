projects:
  title: Projekte (Portfolio)
  intro: >
    Dokumentierte technische Portfolio-Projekte mit Python und pandapower zur
    modellgestützten Analyse elektrischer Netze.

  assignments:
  - title: "EV-Integration im Niederspannungsnetz"
    link: "https://github.com/engin-yigit/P1_EV_Impact_Analysis"
    report_link: "https://github.com/engin-yigit/P1_EV_Impact_Analysis/blob/main/results/reports/P1_EV_Kurzbericht.pdf"
    tagline: "Szenariobasierte Lastflussanalyse eines repräsentativen Niederspannungsnetzes bei variabler EV-Penetration und Gleichzeitigkeit. Im Modell war der Transformator der maßgebende Engpass; die Begrenzung der Ladeleistung von 11 auf 7 kW verschob die erste kritische EV-Penetration von ca. 12 % auf ca. 18 %."

  - title: "PV-Hosting-Capacity im Mittelspannungsnetz"
    link: "https://github.com/engin-yigit/P2_PV_Hosting_Capacity"
    report_link: "https://github.com/engin-yigit/P2_PV_Hosting_Capacity/blob/main/results/reports/P2_PV_Kurzbericht.pdf"
    tagline: "Hosting-Capacity-Analyse eines repräsentativen Mittelspannungsnetzes bei steigender dezentraler PV-Einspeisung. Im Modell wurde die erste technische Grenze bei ca. 10,3 MW durch die Leitungsauslastung bestimmt; eine Wirkleistungsbegrenzung erhöhte die Brutto-Aufnahmegrenze auf ca. 14,7 MW, während die effektive Einspeiseleistung nahezu unverändert blieb."

