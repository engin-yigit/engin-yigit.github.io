projects:
  title: Projekte (Portfolio)
  intro: >
    Dokumentierte technische Portfolio- und Weiterbildungsprojekte mit
    Python/pandapower zur modellgestützten Analyse elektrischer Netze.

  assignments:
  - title: "Netzstudie Niederspannung: Auswirkungen von EV-Ladeleistungen"
    link: "https://github.com/engin-yigit/P1_EV_Impact_Analysis"
    report_link: "https://github.com/engin-yigit/P1_EV_Impact_Analysis/blob/main/results/reports/P1_EV_Kurzbericht.pdf"
    tagline: "Szenariobasierte Lastflussanalyse eines repräsentativen Niederspannungsnetzes zur Bewertung von Transformator- und Leitungsauslastung sowie Spannungsprofilen. Ergänzend wurden eine vereinfachte Leistungsbegrenzung und eine Grenzpenetrationsanalyse untersucht."

  - title: "Netzstudie Mittelspannung: PV-Hosting-Capacity"
    link: "https://github.com/engin-yigit/P2_PV_Hosting_Capacity"
    report_link: "https://github.com/engin-yigit/P2_PV_Hosting_Capacity/blob/main/results/reports/P2_PV_Kurzbericht.pdf"
    tagline: "Szenariobasierte Lastflussanalyse eines repräsentativen Mittelspannungsnetzes zur Bewertung steigender PV-Einspeisung, technischer Netzgrenzen und der PV-Hosting-Capacity. Ergänzend wurde eine vereinfachte Wirkleistungsbegrenzung als Mitigationsmaßnahme untersucht."

