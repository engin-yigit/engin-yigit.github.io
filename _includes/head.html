<head>
  {% assign page_title = page.title | default: site.title %}
  {% assign page_description = page.description | default: site.description %}
  {% assign canonical_url = site.url | append: site.baseurl | append: page.url %}

  <title>{{ page_title | escape }}</title>

  <!-- Basic Meta -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="{{ page_description | strip_html | normalize_whitespace | escape }}">

  <meta name="author"
        content="{{ site.author | default: 'Engin Yiğit' | escape }}">

  <link rel="canonical" href="{{ canonical_url }}">

  {% if site.chrome_mobile_color %}
  <meta name="theme-color" content="{{ site.chrome_mobile_color }}">
  {% endif %}

  <!-- Open Graph: LinkedIn and social sharing -->
  <meta property="og:locale" content="de_DE">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.author | default: 'Engin Yiğit' | escape }}">
  <meta property="og:title" content="{{ page_title | escape }}">
  <meta property="og:description"
        content="{{ page_description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ canonical_url }}">

  <!-- Social card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page_title | escape }}">
  <meta name="twitter:description"
        content="{{ page_description | strip_html | normalize_whitespace | escape }}">

  <!-- Favicon -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">

  <!-- Global CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/bootstrap/css/bootstrap.css">

  <!-- Plugins CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/font-awesome/css/all.css">

  <!-- Theme CSS -->
  <link id="theme-style" rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
  <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
