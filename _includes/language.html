{% assign languages = site.data.data.sidebar.languages %}
{% if languages %}
<div class="languages-container container-block">

  <h2 class="container-block-title">
    {{ languages.title }}
  </h2>

  <ul class="list-unstyled languages-list">
    {% for language in languages.info %}
    <li>
      {{ language.idiom }}
      <span class="lang-desc">
        (
        {% if language.link %}
        <a href="{{ language.link }}"
           target="_blank"
           rel="noopener noreferrer">{{ language.level }}</a>
        {% else %}
        {{ language.level }}
        {% endif %}
        )
      </span>
    </li>
    {% endfor %}
  </ul>

</div><!--//languages-->
{% endif %}
