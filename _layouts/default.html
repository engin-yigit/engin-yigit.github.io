#Add "layout: compress" here to compress the html code
---
<!DOCTYPE html>
<!--[if IE 8]> <html lang="{{ site.lang | default: 'de' }}" class="ie8"> <![endif]-->
<!--[if IE 9]> <html lang="{{ site.lang | default: 'de' }}" class="ie9"> <![endif]-->
<!--[if !IE]><!-->
<html lang="{{ site.lang | default: 'de' }}"> <!--<![endif]-->
{% include head.html %}

<body>
  <a href="{{ site.baseurl }}/assets/files/Engin_Yigit_Lebenslauf.pdf"
   class="cv-download-button d-print-none"
   download="Engin_Yigit_Lebenslauf.pdf"
   aria-label="Lebenslauf als PDF herunterladen">
  <i class="fas fa-file-pdf" aria-hidden="true"></i>
  <span>Lebenslauf als PDF</span>
  </a>

<button type="button"
        class="theme-toggle d-print-none"
        id="themeToggle"
        aria-label="Dunklen Modus aktivieren"
        title="Darstellung wechseln">
  <i class="fas fa-moon" aria-hidden="true"></i>
  <span class="theme-toggle-text">Dark Mode</span>
</button>

  <div class="wrapper">
    {% include sidebar.html %}

    <div class="main-wrapper">
      {{ content }}
    </div>
  </div>

  {% include footer.html %}

  {% include scripts.html %}

  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
</body>

</html>
